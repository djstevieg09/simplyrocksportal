<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IPTV Player — Sign In</title>
    <link rel="manifest" href="/static/player-manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/player-apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/static/player-icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IPTV Player">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 22px;
        }
        .logo h1 {
            color: #f87171;
            font-size: 20px;
            margin: 10px 0 2px 0;
        }
        .logo p {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 11px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 7px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 14px;
        }
        input:focus { outline: none; border-color: #dc2626; }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #f97316);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
        }
        button[type="submit"]:active { opacity: 0.85; }
        .error-box {
            background-color: rgba(220,38,38,0.15);
            border: 1px solid rgba(220,38,38,0.5);
            color: #fecaca;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .portal-link {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #64748b;
        }
        .portal-link a {
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <img src="/static/player-icon-192.png" alt="IPTV Player">
            <h1>IPTV Player</h1>
            <p>Sign in with your IPTV credentials</p>
        </div>

        {% if error %}
        <div class="error-box">❌ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/player_login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   placeholder="Your IPTV username" autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password"
                   placeholder="Your IPTV password">

            <button type="submit">▶ Sign In &amp; Watch</button>
        </form>

        <div class="portal-link">
            <a href="/">Go to full portal instead</a>
        </div>
    </div>
</body>
</html>
