<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SimplyRocks Portal</title>
    <style>
        :root { color-scheme: dark; }
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background-color: #1e293b;
            padding: 24px 24px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px -3px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }
        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-header h1 {
            color: #60a5fa;
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 800;
        }
        .login-header p {
            color: #94a3b8;
            margin: 0;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.5);
        }
        .login-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            margin-top: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-btn:hover {
            background-color: #1d4ed8;
        }
        .secondary-btn {
            background-color: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .secondary-btn:hover {
            background-color: #3f4a5f;
        }
        .error-box, .info-box, .success-box {
            border-radius: 6px;
            font-size: 13px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: left;
        }
        .error-box {
            background-color: rgba(220, 38, 38, 0.15);
            border: 1px solid #ef4444;
            color: #fecaca;
        }
        .info-box {
            background-color: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.6);
            color: #bfdbfe;
        }
        .success-box {
            background-color: rgba(22, 163, 74, 0.15);
            border: 1px solid #22c55e;
            color: #bbf7d0;
        }
        .link-row {
            text-align: center;
            margin-top: 10px;
        }
        .link-row button {
            border: none;
            background: none;
            color: #60a5fa;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            padding: 0;
        }
        #forgot-password-form {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>SimplyRocks Portal</h1>
            <p>Sign in using your IPTV credentials</p>
        </div>

        <!-- Login error from backend -->
        {% if error %}
        <div class="error-box">
            ❌ {{ error }}
        </div>
        {% endif %}

        <!-- Info text -->
        <div class="info-box">
            Use the same username and password you use in your IPTV app (TiviMate, IPTV Smarters, etc.) to log in.
        </div>

        <!-- Login form -->
        <form id="login-form" action="/" method="POST">
            <div class="form-group">
                <label for="username">IPTV Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">IPTV Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password..." required>
            </div>

            <!-- Keeps your server address path mapped safely behind the scenes -->
            <input type="hidden" name="dns" value="{{ default_dns }}">

            <button type="submit" class="login-btn">Sign In to Dashboard</button>
        </form>

        <div class="link-row" id="forgot-password-link-row">
            <button type="button" onclick="showForgotPasswordForm()">Forgotten your password?</button>
        </div>

        <!-- Forgot password form -->
        <div id="forgot-password-form">
            <div class="info-box" style="margin-top:12px;">
                Enter your username below. The admin will be notified and will get your password back to you.
            </div>
            <div id="forgot-password-feedback" style="display:none;"></div>
            <div class="form-group">
                <label for="forgot-username">IPTV Username</label>
                <input type="text" id="forgot-username" placeholder="Enter your username..." autocomplete="off">
            </div>
            <button type="button" class="login-btn" onclick="submitForgotPassword()">Notify Admin</button>
            <div class="link-row">
                <button type="button" onclick="hideForgotPasswordForm()">Back to Login</button>
            </div>
        </div>
    </div>

    <script>
        function showForgotPasswordForm() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('forgot-password-link-row').style.display = 'none';
            document.getElementById('forgot-password-form').style.display = 'block';
        }

        function hideForgotPasswordForm() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('forgot-password-link-row').style.display = 'block';
            document.getElementById('forgot-password-form').style.display = 'none';
            document.getElementById('forgot-password-feedback').style.display = 'none';
        }

        async function submitForgotPassword() {
            const username = document.getElementById('forgot-username').value.trim();
            const feedback = document.getElementById('forgot-password-feedback');

            if (!username) {
                feedback.className = 'error-box';
                feedback.innerText = '❌ Please enter your username.';
                feedback.style.display = 'block';
                return;
            }

            try {
                const resp = await fetch('/forgot_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await resp.json();

                if (data.success) {
                    feedback.className = 'success-box';
                    feedback.innerText = '✅ ' + data.message;
                    document.getElementById('forgot-username').value = '';
                } else {
                    feedback.className = 'error-box';
                    feedback.innerText = '❌ ' + (data.message || 'Something went wrong.');
                }
                feedback.style.display = 'block';
            } catch (e) {
                feedback.className = 'error-box';
                feedback.innerText = '❌ Could not contact server. Please try again.';
                feedback.style.display = 'block';
            }
        }
    </script>

</body>
</html>
